<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account — Vistara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>
  <div id="navbar"></div>

  <div class="page-wrapper">
    <main class="auth-page">
      <div class="auth-card">
        <h1>Create your account</h1>
        <p class="auth-subtitle">It takes a moment, and then you can start uploading.</p>

        <div id="register-alert"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">Name</label>
            <input type="text" id="name" class="form-input" placeholder="Your name" autocomplete="name">
          </div>

          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="At least 6 characters" autocomplete="new-password">
          </div>

          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" class="form-input" placeholder="Repeat your password" autocomplete="new-password">
          </div>

          <button type="submit" id="register-btn" class="btn btn-primary btn-lg w-full mt-2">Create Account</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="/login.html">Sign in</a>
        </div>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <script src="/js/api.js?v=9"></script>
  <script src="/js/auth.js?v=9"></script>
  <script src="/js/register.js?v=9"></script>
</body>
</html>
