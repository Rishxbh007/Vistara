<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse — Vistara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>
  <div id="navbar"></div>

  <div class="page-wrapper">
    <main>
      <div class="container">
        <div class="page-header">
          <h1>Browse the library</h1>
          <p>Search by title or filter by category to find something to watch.</p>
        </div>

        <div class="search-bar">
          <div class="search-input-wrapper">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/>
            </svg>
            <input type="search" id="search-input" class="form-input" placeholder="Search videos by title…" aria-label="Search videos">
            <button type="button" class="search-clear hidden" id="search-clear" aria-label="Clear search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
            </button>
          </div>
        </div>

        <!-- Category filters are always-visible chips, not a dropdown -->
        <div class="filter-chips" id="category-filter" role="tablist" aria-label="Filter by category">
          <button class="chip is-active" data-category="All" role="tab" aria-selected="true">All</button>
        </div>

        <div class="browse-resultbar" id="result-bar" aria-live="polite"></div>

        <div class="video-grid" id="video-grid"></div>

        <div class="empty-state hidden" id="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.7" y2="16.7"/>
          </svg>
          <h3>No videos found</h3>
          <p>Nothing matched that search. Try a different term or clear the category filter.</p>
        </div>

        <div style="height: var(--space-20)"></div>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <script src="/js/api.js?v=9"></script>
  <script src="/js/auth.js?v=9"></script>
  <script src="/js/browse.js?v=9"></script>
</body>
</html>
