<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Upload — Vistara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>
  <div id="navbar"></div>

  <div class="page-wrapper">
    <main class="upload-page">
      <div class="container-md">
        <div class="page-header">
          <h1>Upload a video</h1>
          <p>MP4, WebM or MKV, up to 500MB. A thumbnail is optional but makes your video look much better in the grid.</p>
        </div>

        <div class="upload-card">
          <div id="upload-alert"></div>

          <form id="upload-form" novalidate>
            <!-- Video file -->
            <div class="form-group">
              <label class="form-label">Video file</label>

              <div class="dropzone" id="video-dropzone">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                  <polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <p><span class="dropzone-cta">Choose a file</span> or drag it here</p>
                <p class="text-xs text-tertiary">MP4, WebM or MKV &middot; max 500MB</p>
              </div>

              <input type="file" id="video-file" accept="video/mp4,video/webm,video/x-matroska,.mp4,.webm,.mkv" class="hidden">

              <div class="file-preview hidden" id="video-preview">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                  <rect x="2" y="4" width="20" height="16" rx="3"/><polygon points="10 9 15 12 10 15" fill="currentColor" stroke="none"/>
                </svg>
                <span class="file-name" id="video-file-name"></span>
                <span class="file-size" id="video-file-size"></span>
                <button type="button" class="file-remove" id="video-file-remove" aria-label="Remove video">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Thumbnail -->
            <div class="form-group">
              <label class="form-label">Thumbnail <span class="text-tertiary" style="font-weight:400">(optional)</span></label>

              <div class="dropzone" id="thumb-dropzone">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/>
                  <polyline points="21 15 16 10 5 21"/>
                </svg>
                <p><span class="dropzone-cta">Choose an image</span> or drag it here</p>
                <p class="text-xs text-tertiary">JPG, PNG or WebP &middot; max 5MB</p>
              </div>

              <input type="file" id="thumb-file" accept="image/jpeg,image/png,image/webp" class="hidden">

              <div class="file-preview file-preview-thumb hidden" id="thumb-preview">
                <img id="thumb-preview-img" alt="Thumbnail preview">
                <div class="file-preview-info">
                  <span class="file-name" id="thumb-file-name"></span>
                  <span class="file-size" id="thumb-file-size"></span>
                </div>
                <button type="button" class="file-remove" id="thumb-file-remove" aria-label="Remove thumbnail">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                    <line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Details -->
            <div class="form-group">
              <label class="form-label" for="title">Title</label>
              <input type="text" id="title" class="form-input" placeholder="Give your video a title" maxlength="120">
            </div>

            <div class="form-group">
              <label class="form-label" for="description">Description</label>
              <textarea id="description" class="form-textarea" placeholder="What is this video about?"></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="category">Category</label>
              <select id="category" class="form-select">
                <option value="Uncategorized">Uncategorized</option>
                <option value="Education">Education</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Music">Music</option>
                <option value="Gaming">Gaming</option>
                <option value="Sports">Sports</option>
                <option value="Technology">Technology</option>
                <option value="Travel">Travel</option>
              </select>
            </div>

            <button type="submit" id="upload-btn" class="btn btn-primary btn-lg w-full">Upload Video</button>

            <div class="upload-progress" id="upload-progress">
              <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progress-fill"></div>
              </div>
              <div class="progress-text" id="progress-text">Uploading... 0%</div>
            </div>
          </form>
        </div>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <script src="/js/api.js?v=9"></script>
  <script src="/js/auth.js?v=9"></script>
  <script src="/js/upload.js?v=9"></script>
</body>
</html>
