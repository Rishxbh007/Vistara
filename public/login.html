<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Vistara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css?v=9">
</head>
<body>
  <div id="navbar"></div>

  <div class="page-wrapper">
    <main class="auth-page">
      <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="auth-subtitle">Sign in to upload and manage your videos.</p>

        <div id="login-alert"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" placeholder="Your password" autocomplete="current-password">
          </div>

          <button type="submit" id="login-btn" class="btn btn-primary btn-lg w-full mt-2">Sign In</button>
        </form>

        <div class="auth-footer">
          New to Vistara? <a href="/register.html">Create an account</a>
        </div>
      </div>
    </main>

    <div id="footer"></div>
  </div>

  <script src="/js/api.js?v=9"></script>
  <script src="/js/auth.js?v=9"></script>
  <script src="/js/login.js?v=9"></script>
</body>
</html>
